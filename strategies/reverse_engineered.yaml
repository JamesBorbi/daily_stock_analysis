# 反向分析策略 - 基于第三方选股系统历史数据
# 生成时间: 2026-06-27
# 样本: 215 次选股, 成功率 98.14%

name: reverse_engineered
display_name: 反向分析选股
description: >
  基于高胜率（98.14%）第三方选股系统215次历史选股数据的逆向分析策略。
  核心逻辑：选中趋势强度适中、价格贴近均线的低位反转股。
category: pattern
core_rules: [1, 2, 4, 5]
required_tools:
  - daily_kline
  - trend_analyzer
  - macd
  - volume_analysis
default_active: true
default_router: true
default_priority: 50
market_regimes:
  - trending_up
  - volatile

instructions: |
  ## 选股规则（基于 215 次历史选股数据分析）

  ### 【规则 1 - 趋势强度要求 ⭐⭐⭐⭐⭐】
  - 趋势强度 >= 30（成功组均值 44，失败组均值 21）
  - 如果趋势强度 < 25，**谨慎买入**
  - 趋势强度 > 60 时，检查是否过度追高

  ### 【规则 2 - 价格位置要求 ⭐⭐⭐⭐】
  - 价格在 MA5 附近，乖离率在 -3% ~ +5% 之间
  - 成功组平均乖离率 MA5 = +0.62%
  - 失败组平均乖离率 MA5 为负值，说明价格低于均线时风险大
  - **避免价格远离 MA5（乖离率 > 8% 或 < -5%）**

  ### 【规则 3 - 量能要求 ⭐⭐⭐】
  - 量比在 0.5 ~ 2.0 之间
  - 78% 的成功选股量能正常
  - 放量下跌时**谨慎**

  ### 【规则 4 - MACD 状态参考 ⭐⭐⭐】
  - MACD 多头或金叉状态加分
  - 避免 MACD 死叉刚形成时买入
  - 零轴附近金叉信号较强

  ### 【规则 5 - 大盘环境 ⭐⭐⭐】
  - 大盘下跌时谨慎使用本策略
  - 大盘震荡或上行时效果更佳

  ## 补充说明
  - 本策略基于 215 次历史选股数据统计分析生成
  - 排名高低不代表绝对正确，应结合具体情况判断
  - 建议先用历史数据回测验证，再逐步应用于实盘
  - 本策略应**结合现有系统的其他策略一起使用**
